services:
  traffic-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-prediction-streamlit
    ports:
      - "8501:8501"
    restart: unless-stopped

  jupyter:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: traffic-prediction-jupyter
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/workspace
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --IdentityProvider.token=''
      --IdentityProvider.password_required=False
    restart: unless-stopped
