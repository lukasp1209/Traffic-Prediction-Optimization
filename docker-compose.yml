version: "3.9"
services:
  traffic-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-prediction-streamlit
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - traffic-api

  traffic-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-prediction-api
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
